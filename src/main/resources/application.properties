spring.application.name=bank

# DataSource (overridden by Docker Compose in local dev via spring-boot-docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/finance_app
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.docker.compose.enabled=false

server.port=9090

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
# ddl-auto=validate: Hibernate validates schema against DB on startup (Flyway owns schema creation)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson date/time config handled in JacksonConfig.java (Jackson 3.x / Spring Boot 4.x)

# Actuator — only health and info exposed publicly
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
