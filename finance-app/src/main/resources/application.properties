spring.application.name=bank

# CORS — comma-separated list of allowed origins (override per environment)
app.cors.allowed-origins=http://localhost:4200

# Rate limiting — money operations (deposit, withdraw, transfer, exchange)
# capacity: max burst size (tokens available immediately)
# refill-per-minute: tokens added per minute (steady-state rate)
app.rate-limit.capacity=20
app.rate-limit.refill-per-minute=20

# DataSource (overridden by Docker Compose in local dev via spring-boot-docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/finance_app
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.docker.compose.enabled=false

server.port=9090

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
# ddl-auto=validate: Hibernate validates schema against DB on startup (Flyway owns schema creation)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Jackson date/time config handled in JacksonConfig.java (Jackson 3.x / Spring Boot 4.x)

# Actuator — only health and info exposed publicly
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

# External audit — uses httpbin.org as a real external HTTP endpoint.
# The delay (0 / 2 / 10 s) is chosen randomly in ExternalAuditService to simulate
# fast responses, slow-but-ok responses, and timeouts.
audit.service.base-url=https://httpbun.com
audit.service.connect-timeout-ms=3000
audit.service.read-timeout-ms=3000
